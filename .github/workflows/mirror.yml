name: mirror.yml

on:
  pull_request:
    branches-ignore:
      - 'ga-ignore-*'
    types:
      - opened
  push:
    branches-ignore:
      - 'ga-ignore-*'

env:
  MIRROR_URL: "git@github.com:EpitechPGE3-2026/G-ING-500-PAR-5-1-rtype-8.git"
  BINARY: "Games/r-type_client,Games/r-type_server"

jobs:
  check_valid_repo:
    runs-on: ubuntu-latest
    outputs:
      run_action: ${{ steps.valid.outputs.run_action }}
    steps:
      - name: Verify if in correct repository
        id: valid
        if: ${{ !contains(env.MIRROR_URL, github.repository) }}
        run: echo "run_action=true" >> "$GITHUB_OUTPUT"

  check_program_compilation:
    needs: check_valid_repo
    if: needs.check_valid_repo.outputs.run_action == 'true'
    runs-on: ubuntu-latest
    container:
      image: epitechcontent/epitest-docker:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Install toolchain
        run: |
          pip install --break-system-packages cmake
          # install g++-14 and raylib here if the image lacks them
          cmake --version
      - name: Configure and build
        timeout-minutes: 5
        run: |
          cmake -S . -B build -DCMAKE_CXX_COMPILER=g++-14 -DCMAKE_C_COMPILER=gcc-14
          cmake --build build -j
      - name: Check Binary
        run: |
          for file in $(echo "${{ env.BINARY }}" | sed "s/,/ /g"); do
            if ! [ -x "$file" ]; then
              echo "::error::File '$file' does not exist or is not executable."
              exit 1
            fi
          done

  push_to_mirror:
    needs: [check_valid_repo, check_program_compilation]
    if: needs.check_valid_repo.outputs.run_action == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: '0'
      - name: Mirror
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.MIRROR_URL }}
          ssh_private_key: ${{ secrets.GIT_SSH_PRIVATE_KEY }}
